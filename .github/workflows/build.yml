name: Build and Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish src/Leaf.BreakReminder/Leaf.BreakReminder.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:EnableMsixTooling=true
          -o publish

      - name: Download Windows App Runtime Redistributable
        run: >
          Invoke-WebRequest -Uri
          "https://github.com/microsoft/WindowsAppSDK/releases/download/v1.6.250108002/WindowsAppRuntimeInstall-x64.exe"
          -OutFile publish/WindowsAppRuntimeInstall-x64.exe
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Leaf.BreakReminder
          path: |
            publish/Leaf.BreakReminder.exe
            publish/WindowsAppRuntimeInstall-x64.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Leaf.BreakReminder.exe
            publish/WindowsAppRuntimeInstall-x64.exe
          generate_release_notes: true
