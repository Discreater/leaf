name: Build

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libpango1.0-dev libcairo2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install nsh CLI (nightly, for the TSX tray)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh -s -- --nightly
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check and build the app (Rust + TSX)
        if: runner.os == 'Linux'
        run: |
          nsh check
          nsh build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: leaf-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/leaf
            target/${{ matrix.target }}/release/leaf.exe
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp artifacts/leaf-x86_64-unknown-linux-gnu/leaf dist/leaf-linux-x86_64
          cp artifacts/leaf-x86_64-apple-darwin/leaf dist/leaf-macos-x86_64
          cp artifacts/leaf-x86_64-pc-windows-msvc/leaf.exe dist/leaf-windows-x86_64.exe
          chmod +x dist/leaf-linux-x86_64 dist/leaf-macos-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/leaf-linux-x86_64
            dist/leaf-macos-x86_64
            dist/leaf-windows-x86_64.exe
