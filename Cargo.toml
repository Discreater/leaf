[package]
name = "leaf"
description = "A cross-platform desktop break reminder built with Native Shell (nsh)."
version = "1.0.0"
edition = "2024"
license = "MIT"

[lib]
name = "leaf"
path = "src/lib.rs"

[[bin]]
name = "leaf"
path = "src/main.rs"

[dependencies]
env_logger = "0.11"
log = "0.4"
nsh-core = "0.4"
nsh-base = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
